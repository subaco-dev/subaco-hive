# subaco-hive CI。
# - ubuntu + macos の 2 OS マトリクスで ruff（lint + format）と pytest を実行する。
#   flock / SO_PEERCRED / LOCAL_PEERCRED 等の OS 依存機構を主要プラットフォームで検証するため
#   並行性テスト（tests/test_concurrency.py）は両ランナー必須。
# - stdlib のみで動く層は外部依存なしで緑になる。Zvec / MCP SDK は不要。
# - Zvec 統合（記憶系の実バックエンド）は memory extra を解決する別ジョブで ubuntu + macOS(arm64) 実行。
#   zvec が入らない環境では importorskip で丸ごと skip される。
#
# セキュリティ: 供給網対策として、公開後は各 uses を commit SHA でピン留めするのが望ましい
# （封じ込め要件と同型）。v0 ではタグ参照＋最小 permissions で運用する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定は読み取りのみ（最小権限）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest は Apple Silicon（arm64）
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ruff（lint）。Justfile の `just lint` と同一コマンド。
      - name: ruff check
        run: uv run --python 3.11 --with ruff --no-project ruff check .

      # ruff（format 差分検出）。CI は書き換えず差分のみ検出する。
      - name: ruff format --check
        run: uv run --python 3.11 --with ruff --no-project ruff format --check .

      # pytest（stdlib 層。外部依存なしで緑）。並行性テストもここで両 OS 実行される。
      - name: pytest
        run: uv run --python 3.11 --with pytest --no-project pytest -q

  zvec-integration:
    name: zvec integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # zvec 0.6 の wheel は macosx_11_0_arm64 / manylinux_2_28 (x86_64, aarch64) / win_amd64。
        # Intel Mac（macosx x86_64）向けは提供されないため、記憶系はそこでのみ縮退する。
        os: [ubuntu-latest, macos-latest] # macos-latest は Apple Silicon（arm64）
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # memory extra（zvec / fastembed）は **uv.lock に固定した版**で統合テストを実行する
      # （毎回の再解決だと spike で検証済みの Zvec API 契約が将来リリースで無断変動するため）。
      # 実モデルのダウンロード（数百 MB）を伴う日本語 E2E は SUBACO_HIVE_LIVE_EMBEDDING=1 のときだけ走る
      # ため、ここでは設定しない（skip される）。
      - name: pytest (memory extra, locked)
        run: |
          uv sync --locked --python 3.11 --extra memory --extra dev
          uv run --no-sync pytest -q tests/test_memory_zvec.py
