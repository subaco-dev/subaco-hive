# subaco-hive リリース（PyPI 公開）。
# - トリガは semver タグ push（v0.1.0 等）。実装計画書 M1-11 のリリース手順の自動化部分。
# - 認証は PyPI の Trusted Publishing（OIDC）。API トークンを Secrets に置かない。
#   事前に PyPI 側で pending publisher（owner/repo・workflow=release.yml・environment=pypi）を
#   登録しておくこと（手順は RELEASING.md）。
# - タグとパッケージ版（pyproject.toml / subaco_hive/_version.py）の一致をゲートし、
#   公開後にテンプレート同梱用の固定 requirements（uv export）を生成して
#   GitHub Release へ添付する（subaco テンプレートの requirements-hive.txt の実ピン元）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv は v8 以降メジャータグ（@vN）を提供しないため commit SHA でピン留め（pypi-publish と同じ作法）。
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: バージョン一致ゲート（タグ = pyproject = _version.py）
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          proj="$(uv run --no-project python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          # 正規表現でファイル先頭の docstring を誤取得しないよう、モジュールを import して取得する。
          mod="$(uv run --no-project python -c 'from subaco_hive._version import __version__; print(__version__)')"
          echo "tag=$tag pyproject=$proj _version=$mod"
          [ "$tag" = "$proj" ] && [ "$tag" = "$mod" ] || { echo "::error::タグとパッケージ版が一致しません"; exit 1; }

      - name: テスト（stdlib 層 + zvec 統合。uv.lock に固定した版で実行）
        run: |
          uv sync --locked --python 3.11 --extra all --extra dev
          uv run --no-sync pytest -q

      - name: ビルド（sdist + wheel）
        run: uv build

      - name: 固定 requirements の生成（テンプレート同梱用・推移依存の完全固定）
        # 起動スクリプトは `uvx --with-requirements requirements-hive.txt subaco-hive==<版>` の形で
        # 使うため、requirements にはプロジェクト自身を含めない（--no-emit-project）。
        run: |
          uv export --locked --no-dev --extra all --no-emit-project --format requirements-txt \
            -o dist/requirements-hive.txt
          head -5 dist/requirements-hive.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC（Trusted Publishing）に必須
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: requirements を配布物から除外（PyPI へは sdist/wheel のみ）
        run: mv dist/requirements-hive.txt "$RUNNER_TEMP/"

      # v1.14.2 を commit SHA でピン留め（供給網対策）。
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
